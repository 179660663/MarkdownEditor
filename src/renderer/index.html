<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern Markdown editor with live preview, syntax highlighting, and export capabilities" />
    <meta name="author" content="MarkdownEditor" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="icon" type="image/svg+xml" href="./build/favicon.svg" />
    <title>Markdown Editor</title>
    <style>
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #569cd6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loading-text {
        margin-top: 16px;
        font-size: 14px;
        color: #888;
      }
      .loading-container {
        text-align: center;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="initial-loading">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
